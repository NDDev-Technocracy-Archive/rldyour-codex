name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 2"
  workflow_dispatch:

permissions: {}

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks secret scan
    permissions:
      contents: read
    uses: NDDev-OpenNetwork/ci-workflows/.github/workflows/secret-scan.yml@b4421b8660a7b6462095a9f492ea012b2a609abe # 0.1.17
    with:
      # Public repo: pull_request runs untrusted fork code. Pin the hosted runner
      # explicitly — several ci-workflows reusables now default `runner` to the
      # self-hosted `amsterdam` label, so inheriting the default on a pin bump
      # would put fork PRs on trusted private infrastructure.
      runner: ubuntu-latest
