name: dependency-check
permissions:
  contents: read
concurrency:
  group: dependency-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  pins:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/recipe.yml@356a5b38a8fe5b4ac9d11266e42e6196dc6bde49 # v0.6.68
    with:
      hosted-runner: ubuntu-26.04
      recipe: ci-freshness
      prepare: setup
      python-version: 3.13.18
      uv-version: 0.13.8
      tools: just@1.59.0
      repository-token: true
      reports: 'dependency-check.json

        dependency-check-status.json'
      timeout-minutes: 15
'on':
  push:
    branches:
    - main
    paths:
    - config/mcp-runtime-versions.env
    - plugins/rldyour-mcps/.mcp.json
    - scripts/check_mcp_runtime_versions.py
    - .github/workflows/dependency-check.yml
  workflow_dispatch: null
