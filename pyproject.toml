[project]
name = "rldyour-codex"
version = "1.8.19"
description = "rldyour AI CLI configuration for Codex: plugin marketplace, system install, MCP servers, hooks, managed agents, runtime validation, and Serena memory."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
  { name = "Danil Silantyev", email = "rldyourmnd@users.noreply.github.com" },
]
maintainers = [
  { name = "Danil Silantyev", email = "rldyourmnd@users.noreply.github.com" },
]
keywords = ["codex", "openai-codex", "marketplace", "mcp", "claude-code", "agents", "plugins"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Topic :: Software Development",
  "Topic :: Software Development :: Build Tools",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]

[project.urls]
Homepage = "https://github.com/rldyourmnd/rldyour-codex"
Repository = "https://github.com/rldyourmnd/rldyour-codex"
Issues = "https://github.com/rldyourmnd/rldyour-codex/issues"
Changelog = "https://github.com/rldyourmnd/rldyour-codex/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "--cov",
  "--cov-report=term-missing",
  "--cov-report=xml:coverage.xml",
  "--cov-fail-under=75",
  "--junitxml=pytest.xml",
]

[tool.coverage.run]
branch = true
parallel = false

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if __name__ == .__main__.:",
  "raise SystemExit\\(main\\(\\)\\)",
]

[dependency-groups]
ci = [
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "PyYAML==6.0.3",
  "pyright==1.1.414",
  "mcp",
  "zizmor==1.32.0",
]
